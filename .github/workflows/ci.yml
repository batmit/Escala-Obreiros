name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python 3.13 / Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Obter código
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Instalar dependências fixadas
        run: python -m pip install -r requirements-lock.txt
      - name: Verificar dependências
        run: python -m pip check
      - name: Verificar sintaxe Python
        run: python -m compileall -q backend
      - name: Executar testes unitários e de integração
        run: python -m unittest discover -s backend -t . -v

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter código
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verificar sintaxe do calendário
        run: node --check frontend/calendar.js
      - name: Verificar sintaxe da integração HTTP
        run: node --check frontend/api.js
      - name: Executar testes do frontend
        run: node --test frontend/calendar.test.cjs frontend/api.test.cjs

  container:
    name: Container Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validar Compose
        run: docker compose config --quiet
      - name: Construir imagem de produção
        run: docker build --tag escala-obreiros:local .
      - name: Executar todos os testes Python na imagem Linux
        run: docker run --rm --entrypoint python escala-obreiros:local -m unittest discover -s backend -t . -v
      - name: Verificar serviço e preservação do volume após reinício
        run: python scripts/container_smoke.py
      - name: Mostrar logs e encerrar container
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: escala
          POSTGRES_PASSWORD: escala_test_local
          POSTGRES_DB: escala_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U escala -d escala_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://escala:escala_test_local@127.0.0.1:5432/escala_test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - name: Testar SQLite e PostgreSQL, migração e concorrência
        run: python -m unittest discover -s backend -t . -v
      - name: Construir imagem para ensaio Render e Neon
        run: docker build --tag escala-obreiros:local .
      - name: Testar container sem volume com PostgreSQL externo
        env:
          POSTGRES_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: python -m scripts.neon_container_smoke
